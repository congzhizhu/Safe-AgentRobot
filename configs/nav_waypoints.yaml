# ===== 固定航点导航配置 =====
# 坐标系：相对「点开始航点导航那一刻」狗位姿的偏移（单位：米）
#   原点 = 开始导航时狗所在位置；x 轴正方向 = 开始导航时狗前进方向
#   每次点开始，导航器会自动把当前位姿标定为原点（无需摆回上电位置）。
#
# 航点 (x, y) 的含义：沿当前朝向直走 x 米，再向左侧偏移 y 米（y 为负则右侧）。
# 示例：x=1.0, y=0.0 → 直走 1 米；x=0.0, y=1.0 → 原地左移 1 米（需左转 90°）。
#
# 所有控制参数为经验初值，必须真机标定后才能用于正式巡检。

# 到达判定：距离小于此值视为到达（米）
arrival_radius: 0.2

# 朝向对准死区（度）：|朝向误差| 小于此值视为已对准，不再转向。
# 越大越稳（不易震荡），但航向精度越低。轻微震荡时可适当调大。
heading_threshold_deg: 18.0

# 实测原地转角速度（度/秒）：patrol.py 已标定为 55（每秒转约 55 度）。
# 转向采用「固定角速度一次转到位」，用这个值精确计算转向时长，消除比例增益震荡。
turn_deg_per_sec: 55.0

# 线速增益：前进速度 = min(v_max, k_lin * 距离)
k_lin: 1.0

# 前进线速度上限（米/秒），低于硬件上限 0.6 留安全余量
# 避障模式下起步需要足够速度，否则会被判定为原地踏步
v_max: 0.45

# 单次前进指令时长（秒）——加大，避免避障模式起步阶段被频繁打断
forward_step_s: 1.0

# 单航点最大步数 / 超时（秒），防止死循环
max_steps: 200
max_time_s: 60.0

# 是否使用避障移动（ObstaclesAvoidClient）做前进。
# 实测：避障服务会因 LiDAR 误判/未就绪把前进速度压到接近 0，导致狗原地颤动、不直走。
# 固定航点本就是预先规划的安全点位，默认 false（前进走普通 SportClient.Move，可靠）。
# 只有场地确实需要动态避障时才改为 true。
use_avoid: false

# 航点序列（按顺序执行，每个航点到达后即巡检点）
# 建议先用近点验证：第一个点直走 1 米，确认"对准朝向后直线前进"正常，
# 再逐步测试转向、多航点。
waypoints:
  - name: "直行1米测试点"
    x: 1.0
    y: 0.0
  - name: "右转0.8米测试点"
    x: 1.0
    y: -0.8
  - name: "左转0.8米测试点"
    x: 1.0
    y: 0.8
